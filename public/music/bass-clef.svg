<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 100">
  <!-- 五線譜 -->
  <line x1="0" y1="30" x2="50" y2="30" stroke="#ccc" stroke-width="0.8"/>
  <line x1="0" y1="40" x2="50" y2="40" stroke="#ccc" stroke-width="0.8"/>
  <line x1="0" y1="50" x2="50" y2="50" stroke="#ccc" stroke-width="0.8"/>
  <line x1="0" y1="60" x2="50" y2="60" stroke="#ccc" stroke-width="0.8"/>
  <line x1="0" y1="70" x2="50" y2="70" stroke="#ccc" stroke-width="0.8"/>
  <!-- 低音譜號 F clef -->
  <!-- 大圓點在第4線（F線 y=40） -->
  <circle cx="12" cy="40" r="4" fill="#333"/>
  <!-- 曲線從大圓點向右下彎 -->
  <path d="
    M 16 40
    C 24 40 32 42 34 48
    C 36 54 34 62 28 68
    C 22 74 14 74 10 70
  " fill="none" stroke="#333" stroke-width="2.8" stroke-linecap="round"/>
  <!-- 兩個小圓點（F線上下） -->
  <circle cx="38" cy="35" r="2.5" fill="#333"/>
  <circle cx="38" cy="45" r="2.5" fill="#333"/>
</svg>
