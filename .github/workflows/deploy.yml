name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # 每天 00:10 台北（16:10 UTC）：有排程文章到期才部署
    - cron: "10 16 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GSC_CODE: ${{ secrets.NEXT_PUBLIC_GSC_CODE }}
      # GA4 ID is hardcoded in src/app/layout.tsx (public info, env var was unreliable)
      GA4_ID: G-RK197FZYN8
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/generate-content-dates.mjs derives each page's
          # sitemap <lastmod> from the last commit that touched its data file.
          # On the default depth-1 clone every file resolves to the HEAD commit,
          # collapsing all ~350 URLs onto one timestamp — the exact unusable
          # lastmod that script exists to avoid.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scheduled run — skip unless a post is due today
        id: due
        if: github.event_name == 'schedule'
        run: node scripts/publish-scheduled.mjs --due-today && echo "go=1" >> "$GITHUB_OUTPUT" || echo "go=0" >> "$GITHUB_OUTPUT"

      - run: npm run build
        if: github.event_name != 'schedule' || steps.due.outputs.go == '1'

      - name: Convert to Cloudflare Pages format
        if: github.event_name != 'schedule' || steps.due.outputs.go == '1'
        run: npx @cloudflare/next-on-pages || true

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.due.outputs.go == '1'
        # IMPORTANT: nodejs_compat compatibility flag must be enabled in the
        # Cloudflare Pages dashboard (Settings → Functions → Compatibility flags),
        # otherwise all /api/* routes 500 with "No such module 'async_hooks'".
        # Wrangler CLI doesn't accept these flags for `pages deploy`.
        run: npx wrangler pages deploy .vercel/output/static --project-name=learn-chparenting --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: IndexNow submit (Bing / Yahoo)
        if: github.event_name != 'schedule' || steps.due.outputs.go == '1'
        # 把本次 push 改到的頁面即時送進 Bing 系索引；失敗不擋部署
        run: node scripts/indexnow-submit.mjs
        continue-on-error: true

      - name: Verify GA4 is live
        if: github.event_name != 'schedule' || steps.due.outputs.go == '1'
        run: |
          # Guard against empty/missing GA4_ID (prevents false positives from grep "")
          if [ -z "$GA4_ID" ] || [ ${#GA4_ID} -lt 10 ]; then
            echo "❌ GA4_ID is empty or too short ('$GA4_ID') — refusing to smoke test"
            exit 1
          fi
          sleep 30
          for i in 1 2 3; do
            html=$(curl -sL "https://learn.chparenting.com/?cb=$(date +%s)")
            # Use fixed-string grep with explicit non-empty pattern
            if printf '%s' "$html" | grep -qF "$GA4_ID"; then
              echo "✅ GA4 tag $GA4_ID found in deployed HTML"
              exit 0
            fi
            echo "Attempt $i: GA4 not yet visible, retrying in 20s..."
            sleep 20
          done
          echo "❌ GA4 tag $GA4_ID missing from deployed HTML after 3 attempts"
          exit 1
