name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GSC_CODE: ${{ secrets.NEXT_PUBLIC_GSC_CODE }}
      # GA4 ID is hardcoded in src/app/layout.tsx (public info, env var was unreliable)
      GA4_ID: G-RK197FZYN8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Convert to Cloudflare Pages format
        run: npx @cloudflare/next-on-pages || true

      - name: Deploy to Cloudflare Pages
        # nodejs_compat is required for Node built-ins (async_hooks, etc.)
        # that Next.js + supabase-js rely on. Without this flag, all /api/*
        # routes 500 with "No such module 'async_hooks'".
        run: npx wrangler pages deploy .vercel/output/static --project-name=learn-chparenting --branch=main --compatibility-flags=nodejs_compat --compatibility-date=2024-09-23
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify GA4 is live
        run: |
          # Guard against empty/missing GA4_ID (prevents false positives from grep "")
          if [ -z "$GA4_ID" ] || [ ${#GA4_ID} -lt 10 ]; then
            echo "❌ GA4_ID is empty or too short ('$GA4_ID') — refusing to smoke test"
            exit 1
          fi
          sleep 30
          for i in 1 2 3; do
            html=$(curl -sL "https://learn.chparenting.com/?cb=$(date +%s)")
            # Use fixed-string grep with explicit non-empty pattern
            if printf '%s' "$html" | grep -qF "$GA4_ID"; then
              echo "✅ GA4 tag $GA4_ID found in deployed HTML"
              exit 0
            fi
            echo "Attempt $i: GA4 not yet visible, retrying in 20s..."
            sleep 20
          done
          echo "❌ GA4 tag $GA4_ID missing from deployed HTML after 3 attempts"
          exit 1
