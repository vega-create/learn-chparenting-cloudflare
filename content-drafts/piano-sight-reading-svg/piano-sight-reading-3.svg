<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="PingFang TC, Noto Sans TC, Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#263238">「調」就是這首歌的 Do 住在哪個鍵</text>

  <!-- white keys: x = 72 + 88*i, i=0..11 = C D E F G A B C D E F G ; black keys at 72+88*(i+1)-28 -->
  <!-- C major -->
  <text x="72" y="110" font-size="26" font-weight="700" fill="#263238">C 大調：Do 的家在 C，全部白鍵</text>
  <g stroke="#9aa3ab" stroke-width="2">
    <rect x="72" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="160" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="248" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="336" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="424" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="512" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="600" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="688" y="130" width="88" height="210" rx="6" fill="#FAEEDA"/>
    <rect x="776" y="130" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="864" y="130" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="952" y="130" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="1040" y="130" width="88" height="210" rx="6" fill="#ffffff"/>
  </g>
  <g fill="#2C2C2A">
    <rect x="132" y="130" width="56" height="130" rx="5"/>
    <rect x="220" y="130" width="56" height="130" rx="5"/>
    <rect x="396" y="130" width="56" height="130" rx="5"/>
    <rect x="484" y="130" width="56" height="130" rx="5"/>
    <rect x="572" y="130" width="56" height="130" rx="5"/>
    <rect x="748" y="130" width="56" height="130" rx="5"/>
    <rect x="836" y="130" width="56" height="130" rx="5"/>
    <rect x="1012" y="130" width="56" height="130" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="21" font-weight="700" fill="#633806">
    <text x="116" y="316">C Do</text>
    <text x="204" y="316">D Re</text>
    <text x="292" y="316">E Mi</text>
    <text x="380" y="316">F Fa</text>
    <text x="468" y="316">G Sol</text>
    <text x="556" y="316">A La</text>
    <text x="644" y="316">B Si</text>
    <text x="732" y="316">C Do</text>
  </g>

  <!-- G major -->
  <text x="72" y="420" font-size="26" font-weight="700" fill="#263238">G 大調：Do 的家搬到 G，第七個音 Si 要用黑鍵 F♯</text>
  <g stroke="#9aa3ab" stroke-width="2">
    <rect x="72" y="440" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="160" y="440" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="248" y="440" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="336" y="440" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="424" y="440" width="88" height="210" rx="6" fill="#E1F5EE"/>
    <rect x="512" y="440" width="88" height="210" rx="6" fill="#E1F5EE"/>
    <rect x="600" y="440" width="88" height="210" rx="6" fill="#E1F5EE"/>
    <rect x="688" y="440" width="88" height="210" rx="6" fill="#E1F5EE"/>
    <rect x="776" y="440" width="88" height="210" rx="6" fill="#E1F5EE"/>
    <rect x="864" y="440" width="88" height="210" rx="6" fill="#E1F5EE"/>
    <rect x="952" y="440" width="88" height="210" rx="6" fill="#ffffff"/>
    <rect x="1040" y="440" width="88" height="210" rx="6" fill="#E1F5EE"/>
  </g>
  <g fill="#2C2C2A">
    <rect x="132" y="440" width="56" height="130" rx="5"/>
    <rect x="220" y="440" width="56" height="130" rx="5"/>
    <rect x="396" y="440" width="56" height="130" rx="5"/>
    <rect x="484" y="440" width="56" height="130" rx="5"/>
    <rect x="572" y="440" width="56" height="130" rx="5"/>
    <rect x="748" y="440" width="56" height="130" rx="5"/>
    <rect x="836" y="440" width="56" height="130" rx="5"/>
  </g>
  <rect x="1012" y="440" width="56" height="130" rx="5" fill="#1D9E75"/>
  <text x="1040" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">F♯</text>
  <text x="1040" y="548" text-anchor="middle" font-size="18" fill="#ffffff">Si</text>
  <text x="996" y="626" text-anchor="middle" font-size="18" fill="#9aa3ab">F 不用</text>
  <g text-anchor="middle" font-size="21" font-weight="700" fill="#085041">
    <text x="468" y="626">G Do</text>
    <text x="556" y="626">A Re</text>
    <text x="644" y="626">B Mi</text>
    <text x="732" y="626">C Fa</text>
    <text x="820" y="626">D Sol</text>
    <text x="908" y="626">E La</text>
    <text x="1084" y="626">G Do</text>
  </g>

  <text x="600" y="716" text-anchor="middle" font-size="22" fill="#52616B">兩個調的 Do Re Mi 唱起來一樣，只是整首歌搬高了，差別只在那一個黑鍵</text>
</svg>
